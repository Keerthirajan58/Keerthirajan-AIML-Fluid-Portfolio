name: Portfolio verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [immersive-redesign-v2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: portfolio-verification
          retention-days: 14
          path: |
            coverage/
            playwright-report/
            test-results/
